{{- if .Values.recurringService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-recurring
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
    app: recurring
spec:
  replicas: {{ .Values.recurringService.replicaCount }}
  selector:
    matchLabels:
      {{- include "todo-chatbot.selectorLabels" . | nindent 6 }}
      app: recurring
  template:
    metadata:
      labels:
        {{- include "todo-chatbot.selectorLabels" . | nindent 8 }}
        app: recurring
      {{- if .Values.dapr.enabled }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "{{ .Values.dapr.recurringService.appId }}"
        dapr.io/app-port: "{{ .Values.dapr.recurringService.appPort }}"
        dapr.io/config: "{{ .Values.dapr.config }}"
        dapr.io/log-level: "{{ .Values.dapr.logLevel }}"
        {{- if .Values.dapr.recurringService.enableMetrics }}
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "{{ .Values.dapr.recurringService.metricsPort }}"
        {{- end }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.recurringService.podSecurityContext | nindent 8 }}
      containers:
        - name: recurring
          securityContext:
            {{- toYaml .Values.recurringService.securityContext | nindent 12 }}
          image: "{{ .Values.recurringService.image.repository }}:{{ .Values.recurringService.image.tag }}"
          imagePullPolicy: {{ .Values.recurringService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.recurringService.service.targetPort }}
              protocol: TCP
          env:
            # Service configuration
            - name: SERVICE_NAME
              value: "recurring-service"
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
            # Dapr configuration
            {{- if .Values.dapr.enabled }}
            - name: DAPR_ENABLED
              value: "true"
            - name: DAPR_HTTP_PORT
              value: "{{ .Values.dapr.httpPort }}"
            - name: PUBSUB_NAME
              value: "{{ .Values.dapr.pubsubName }}"
            - name: TASK_EVENTS_TOPIC
              value: "{{ .Values.kafka.topics.taskEvents }}"
            - name: BACKEND_APP_ID
              value: "{{ .Values.dapr.backend.appId }}"
            {{- else }}
            - name: DAPR_ENABLED
              value: "false"
            {{- end }}
            # Database URL for storing processed events (idempotency)
            - name: NEON_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "todo-chatbot.fullname" . }}-db-secret
                  key: NEON_DB_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.recurringService.resources | nindent 12 }}
      {{- with .Values.recurringService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.recurringService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.recurringService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
