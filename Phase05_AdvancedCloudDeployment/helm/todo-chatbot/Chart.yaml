apiVersion: v2
name: todo-chatbot
description: A Helm chart for the Todo AI Chatbot application with event-driven architecture
type: application
version: 2.0.0
appVersion: 2.0.0
home: https://github.com/your-org/todo-chatbot
sources:
  - https://github.com/your-org/todo-chatbot
maintainers:
  - name: Osama bin Adnan
    email: binadnanosama@gmail.com
keywords:
  - todo
  - chatbot
  - ai
  - task-management
  - dapr
  - kafka
  - event-driven
  - kubernetes
annotations:
  # Phase 5: Advanced Cloud Deployment
  phase: "5"
  features: |
    - Event-driven architecture with Kafka/Dapr
    - Notification service for reminders
    - Recurring task automation service
    - All 5 Dapr building blocks (pub/sub, state, secrets, bindings, service invocation)
    - Local Minikube and Oracle OKE deployment support
