# Dapr Pub/Sub Component - Kafka Backend
# Phase 5: Event-driven architecture (FR-024)
# Environment: Production (Oracle OKE)

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    # Kafka broker address (Strimzi internal service)
    - name: brokers
      value: "taskflow-kafka-kafka-bootstrap.kafka:9092"
    # Consumer group for this application
    - name: consumerGroup
      value: "todo-service"
    # Authentication via SASL for production
    - name: authType
      value: "none"  # Change to "sasl" if using external Kafka
    # Message settings
    - name: maxMessageBytes
      value: "1048576"  # 1MB
    # Consumer settings
    - name: consumeRetryInterval
      value: "200ms"
    - name: version
      value: "3.7.0"
    # Initial offset for new consumers
    - name: initialOffset
      value: "newest"
    # TLS for production (enabled if using external access)
    - name: disableTls
      value: "true"  # Set to "false" for external Kafka with TLS
scopes:
  - backend
  - notification-service
  - recurring-service
