# Dapr Pub/Sub Component - Kafka Backend
# Phase 5: Event-driven architecture (FR-024)
# Environment: Minikube (Local Development)

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    # Kafka broker address (Redpanda internal service)
    - name: brokers
      value: "redpanda-0.redpanda.kafka.svc.cluster.local:9093"
    # Consumer group for this application
    - name: consumerGroup
      value: "todo-service"
    # Authentication (none for internal Minikube)
    - name: authType
      value: "none"
    # Message settings
    - name: maxMessageBytes
      value: "1048576"  # 1MB
    # Consumer settings
    - name: consumeRetryInterval
      value: "100ms"
    - name: version
      value: "3.7.0"
    # Initial offset for new consumers
    - name: initialOffset
      value: "newest"
    # Disable TLS for internal communication
    - name: disableTls
      value: "true"
scopes:
  - backend
  - notification-service
  - recurring-service
